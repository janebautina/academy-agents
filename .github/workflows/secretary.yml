# Runs the secretary every morning in GitHub's cloud: your computer can be off.
# Needs repository secrets LLM_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (Settings › Secrets and variables › Actions). Without LLM_API_KEY the job skips itself.
name: Secretary

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Moscow
  workflow_dispatch:       # the "Run workflow" button for a manual run

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_FOLDER_ID: ${{ vars.LLM_FOLDER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COMPANY_LANGUAGE: ${{ vars.COMPANY_LANGUAGE || 'ru' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Morning summary
        run: |
          if [ -z "$LLM_API_KEY" ]; then echo "LLM_API_KEY secret is not set, skipping"; exit 0; fi
          python -m agents.secretary.run
